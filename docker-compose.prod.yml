# 生产环境 Docker Compose 配置
# 使用方法: docker-compose -f docker-compose.prod.yml up -d

services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    ports:
      - "80:80"
    environment:
      # 默认使用 SQLite，可设置为 postgres 切换到 PostgreSQL
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      # PostgreSQL 模式下必填
      DATABASE_URL: ${DATABASE_URL:-}
      # 必填：JWT 签名密钥
      JWT_SECRET: ${JWT_SECRET}
      # CORS 白名单
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:5173,http://127.0.0.1:5173}
      # 认证 Cookie 配置
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-auth_token}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      # 首次启动管理员初始化（仅数据库为空时生效）
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      # 可选：Gin 运行模式
      GIN_MODE: ${GIN_MODE:-release}
    volumes:
      - ${HOST_DATA_DIR:-./runtime/data}:/data
      - ${HOST_CACHE_DIR:-./runtime/cache}:/cache
    restart: unless-stopped

  db:
    profiles: ["postgres"]
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-basegoapp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
