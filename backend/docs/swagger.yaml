basePath: /
definitions:
  buildinfo.Info:
    properties:
      build_time:
        type: string
      channel:
        type: string
      commit:
        type: string
      version:
        type: string
    type: object
  handler.SetUserRoleRequest:
    properties:
      is_admin:
        type: boolean
    type: object
  releasenotes.Change:
    properties:
      id:
        type: string
      text:
        $ref: '#/definitions/releasenotes.LocalizedText'
      type:
        type: string
    type: object
  releasenotes.LocalizedList:
    properties:
      en:
        items:
          type: string
        type: array
      zh-CN:
        items:
          type: string
        type: array
    type: object
  releasenotes.LocalizedText:
    properties:
      en:
        type: string
      zh-CN:
        type: string
    type: object
  releasenotes.Release:
    properties:
      changes:
        items:
          $ref: '#/definitions/releasenotes.Change'
        type: array
      channel:
        type: string
      image_tag:
        type: string
      published_at:
        type: string
      release_url:
        type: string
      schema_version:
        type: integer
      summary:
        $ref: '#/definitions/releasenotes.LocalizedText'
      upgrade_notes:
        $ref: '#/definitions/releasenotes.LocalizedList'
      version:
        type: string
    type: object
  response.Response:
    properties:
      code:
        type: integer
      data: {}
      error_code:
        type: string
      message:
        type: string
    type: object
  service.ChangePasswordRequest:
    properties:
      new_password:
        minLength: 6
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  service.IntegrationMediaSettingsResponse:
    properties:
      api_key:
        type: string
      configured:
        type: boolean
      server_url:
        type: string
    type: object
  service.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  service.PublicEventResponse:
    properties:
      app_code:
        type: string
      display_event_type:
        type: string
      is_fallback:
        type: boolean
      occurred_at:
        type: string
      presentation:
        $ref: '#/definitions/webhook.Presentation'
      presentation_version:
        type: integer
      received_at:
        type: string
      severity:
        type: string
      source_event_type:
        type: string
      summary:
        type: string
      title:
        type: string
    type: object
  service.RegisterRequest:
    properties:
      password:
        minLength: 6
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  service.SetupAdminRequest:
    properties:
      password:
        minLength: 6
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  service.SystemSettingsResponse:
    properties:
      allow_register:
        type: boolean
      api_log_retention_days:
        type: integer
      http_proxy_configured:
        type: boolean
      http_proxy_url:
        type: string
      public_base_url:
        type: string
      tmdb_api_key:
        type: string
      tmdb_configured:
        type: boolean
      tmdb_use_proxy:
        type: boolean
    type: object
  service.TestHTTPProxyRequest:
    properties:
      http_proxy_url:
        type: string
    required:
    - http_proxy_url
    type: object
  service.TestTMDBConnectionRequest:
    properties:
      http_proxy_url:
        type: string
      tmdb_api_key:
        type: string
      use_proxy:
        type: boolean
    required:
    - tmdb_api_key
    type: object
  service.TokenResponse:
    properties:
      expires_at:
        type: integer
      token:
        type: string
    type: object
  service.UpdateIntegrationMediaSettingsRequest:
    properties:
      api_key:
        type: string
      server_url:
        type: string
    required:
    - api_key
    - server_url
    type: object
  service.UpdateStatusResponse:
    properties:
      checked_at:
        type: string
      current:
        $ref: '#/definitions/buildinfo.Info'
      image_tag:
        type: string
      latest_version:
        type: string
      releases:
        items:
          $ref: '#/definitions/releasenotes.Release'
        type: array
      supported:
        type: boolean
      update_available:
        type: boolean
    type: object
  service.UpdateSystemSettingsRequest:
    properties:
      allow_register:
        type: boolean
      api_log_retention_days:
        type: integer
      clear_http_proxy:
        type: boolean
      clear_tmdb_api_key:
        type: boolean
      http_proxy_url:
        type: string
      public_base_url:
        type: string
      tmdb_api_key:
        type: string
      tmdb_use_proxy:
        type: boolean
    type: object
  service.UserResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      is_admin:
        type: boolean
      requires_admin_setup:
        type: boolean
      username:
        type: string
    type: object
  webhook.Presentation:
    properties:
      data:
        additionalProperties: true
        type: object
      facts:
        items:
          additionalProperties:
            type: string
          type: object
        type: array
      links:
        items:
          additionalProperties:
            type: string
          type: object
        type: array
      schema_version:
        type: integer
      severity:
        type: string
      summary:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Seshat Webhook 消息管理 API 文档
  title: Seshat API
  version: "1.0"
paths:
  /api/admin/updates:
    get:
      description: Beta 只检查 Beta，Release/Hotfix 只检查正式版本（需要管理员权限）
      parameters:
      - description: 忽略缓存并重新检查
        in: query
        name: refresh
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.UpdateStatusResponse'
              type: object
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 检查更新
      tags:
      - 更新
  /api/admin/users:
    get:
      description: 获取所有用户列表（需要管理员权限）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/service.UserResponse'
                  type: array
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取用户列表
      tags:
      - 管理
  /api/admin/users/{id}/role:
    put:
      consumes:
      - application/json
      description: 将用户提升或降级管理员权限（需要管理员权限）
      parameters:
      - description: 用户ID
        in: path
        name: id
        required: true
        type: integer
      - description: 角色信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.SetUserRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 设置用户角色
      tags:
      - 管理
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: 用户登录获取 JWT Token
      parameters:
      - description: 登录信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.TokenResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      summary: 用户登录
      tags:
      - 认证
  /api/auth/logout:
    post:
      description: 使当前用户已签发的 Bearer Token 立即失效
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 用户退出
      tags:
      - 认证
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: 创建新用户账户
      parameters:
      - description: 注册信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.UserResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      summary: 用户注册
      tags:
      - 认证
  /api/auth/setup-admin:
    post:
      consumes:
      - application/json
      description: 使用一次性 admin/admin 登录后设置正式管理员用户名和密码
      parameters:
      - description: 管理员凭据
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.SetupAdminRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.TokenResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 设置正式管理员凭据
      tags:
      - 认证
  /api/public/events/{token}:
    get:
      description: 通过不可猜测的访问标识获取标准化展示，不返回原始消息或内部信息
      parameters:
      - description: 公开访问标识
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.PublicEventResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      summary: 获取公开消息详情
      tags:
      - Webhook
  /api/public/media-images/{token}:
    get:
      parameters:
      - description: 图片访问标识
        in: path
        name: token
        required: true
        type: string
      produces:
      - image/jpeg
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      summary: 获取缓存媒体图片
      tags:
      - Webhook
  /api/settings/registration-status:
    get:
      description: 检查系统是否允许注册（公开接口）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties:
                    type: boolean
                  type: object
              type: object
      summary: 获取注册状态
      tags:
      - 设置
  /api/settings/system:
    get:
      description: 获取所有系统设置（需要管理员权限）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.SystemSettingsResponse'
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取系统设置
      tags:
      - 设置
    put:
      consumes:
      - application/json
      description: 更新系统设置（需要管理员权限）
      parameters:
      - description: 系统设置
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.UpdateSystemSettingsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 更新系统设置
      tags:
      - 设置
  /api/settings/system/test-http-proxy:
    post:
      consumes:
      - application/json
      description: 使用当前输入的代理地址访问固定 HTTPS 探测地址（需要管理员权限）
      parameters:
      - description: HTTP 代理测试配置
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.TestHTTPProxyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 测试 HTTP 代理
      tags:
      - 设置
  /api/settings/system/test-tmdb:
    post:
      consumes:
      - application/json
      description: 使用当前输入的 API 密钥和代理配置请求 TMDB（需要管理员权限）
      parameters:
      - description: TMDB 测试配置
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.TestTMDBConnectionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 测试 TMDB 连接
      tags:
      - 设置
  /api/user/password:
    put:
      consumes:
      - application/json
      description: 修改当前用户的密码
      parameters:
      - description: 密码信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 修改密码
      tags:
      - 用户
  /api/user/profile:
    get:
      description: 获取当前登录用户的详细信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.UserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取用户信息
      tags:
      - 用户
  /api/version:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/buildinfo.Info'
              type: object
      summary: 获取当前版本
      tags:
      - 更新
  /api/webhooks/integrations/{id}/media-settings:
    get:
      parameters:
      - description: 接入实例 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.IntegrationMediaSettingsResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取实例媒体 API 配置
      tags:
      - Webhook
    put:
      consumes:
      - application/json
      parameters:
      - description: 接入实例 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 媒体 API 配置
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.UpdateIntegrationMediaSettingsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.IntegrationMediaSettingsResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 保存实例媒体 API 配置
      tags:
      - Webhook
  /api/webhooks/integrations/{id}/media-settings/test:
    post:
      consumes:
      - application/json
      parameters:
      - description: 接入实例 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 媒体 API 配置
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.UpdateIntegrationMediaSettingsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 测试实例媒体 API
      tags:
      - Webhook
securityDefinitions:
  BearerAuth:
    description: 输入 Bearer {token}
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
