# 使用 Docker Hub 已发布镜像的生产环境配置
# 使用方法: docker compose -f docker-compose.dockerhub.yml up -d

services:
  app:
    image: ${SESHAT_IMAGE:-hienao/seshat:beta}
    ports:
      - "80:80"
    environment:
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-}
      JWT_SECRET: ${JWT_SECRET}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY}
      API_LOG_ENABLED: ${API_LOG_ENABLED:-true}
      API_LOG_PATH: ${API_LOG_PATH:-/cache/logs/app/api-logs.db}
      API_LOG_RETENTION_DAYS: ${API_LOG_RETENTION_DAYS:-30}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-auth_token}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
      GIN_MODE: ${GIN_MODE:-release}
    volumes:
      - ${HOST_DATA_DIR:-./runtime/data}:/data
      - ${HOST_CACHE_DIR:-./runtime/cache}:/cache
    restart: unless-stopped

  db:
    profiles: ["postgres"]
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-basegoapp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
