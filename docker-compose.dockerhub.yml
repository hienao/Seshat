# 使用 Docker Hub 已发布镜像的生产环境配置
# 使用方法: docker compose -f docker-compose.dockerhub.yml up -d

services:
  app:
    image: ${SESHAT_IMAGE:-hienao/seshat:beta}
    ports:
      - "80:80"
    environment:
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ${HOST_DATA_DIR:-./runtime/data}:/data
      - ${HOST_CACHE_DIR:-./runtime/cache}:/cache
    restart: unless-stopped

  db:
    profiles: ["postgres"]
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-basegoapp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
